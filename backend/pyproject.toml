[project]
name = "ipl-draft-simulation"
version = "0.1.0"
description = "IPL Draft & Simulation Platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.49,<0.50",
    "pydantic>=2.13,<3.0",
    "sqlalchemy>=2.0.50,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.18,<1.19",
    "numpy>=2.4,<2.5",
    "scipy>=1.17,<1.18",
    "pandas>=3.0,<3.1",
    "pulp>=2.9.0",
    "redis[hiredis]>=8.0,<9.0",
    "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<9.1",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<2.2",
]
